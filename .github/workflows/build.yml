name: Kernel CI ReSukiSU — build & package

on:
  push:
    branches: [ main, master, lineage-23.2 ]
  workflow_dispatch:

env:
  KERNEL_PATH: kernel_src
  BUILD_DIR: out
  ARCH: arm64
  DEFCONFIG: lito-perf_defconfig
  CCACHE_SIZE: 5G
  BOOT_URL: 'https://mirrorbits.lineageos.org/full/kiev/20260705/boot.img'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache flex glibc-source libelf-dev libssl-dev libncurses-dev gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi clang llvm lld device-tree-compiler zip unzip curl git python3

      - name: Download Stock Boot Image
        shell: bash
        run: |
          set -euo pipefail
          echo "📥 Téléchargement du boot.img d'origine (LineageOS 23.2)..."
          curl -fLo boot-stock.img "${{ env.BOOT_URL }}" || { echo "❌ Erreur download boot.img"; exit 1; }

      - name: Clone Kernel Source
        run: |
          git clone https://github.com/Albanel22/Motorola-one-5G-ace_ResukiSu.git -b lineage-23.2 --depth=1 ${{ env.KERNEL_PATH }}

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-resukisu
          restore-keys: ${{ runner.os }}-ccache-

      - name: 📂 Injection & Sécurisation de ReSukiSU
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -e
          echo "📥 Initialisation de ReSukiSU via le script officiel..."
          
          # 1. Récupération et exécution du setup ReSukiSU officiel
          curl -fLo setup.sh https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh
          chmod +x setup.sh
          bash setup.sh

          # 2. Sécurisation adaptative mmap_sem vers mmap_lock (Spécifique Android 11+)
          sed -i 's/mmap_sem/mmap_lock/g' fs/proc/base.c || true
          sed -i 's/mmap_sem/mmap_lock/g' fs/proc/task_mmu.c || true

          # 3. Pré-injection des flags requis par ReSukiSU dans le defconfig
          TARGET_DEFCONFIG="arch/arm64/configs/vendor/lito-perf_defconfig"
          {
            echo "CONFIG_RESUKISU=y"
            echo "CONFIG_RESUKISU_SUS_PATH=y"
            echo "CONFIG_RESUKISU_SUS_MOUNT=y"
            echo "CONFIG_RESUKISU_TRY_UMOUNT=y"
            echo "CONFIG_RESUKISU_SPOOF_UNAME=y"
            echo "CONFIG_RESUKISU_HIDE_KSU_DIR=y"
            echo "CONFIG_KSU_MANUAL_HOOK=y"
          } >> "$TARGET_DEFCONFIG"

          echo "✅ Phase de préparation ReSukiSU achevée."

      - name: Multi-stage Kernel Compilation
        working-directory: ${{ env.KERNEL_PATH }}
        run: |
          set -uo pipefail
          export ARCH=${{ env.ARCH }}
          export SUBARCH=${{ env.ARCH }}
          export USE_CCACHE=1
          export CCACHE_EXEC=$(which ccache)
          ccache -M ${{ env.CCACHE_SIZE }}
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export KCFLAGS="-Wno-error"
          
          cp arch/arm64/configs/vendor/${{ env.DEFCONFIG }} arch/arm64/configs/${{ env.DEFCONFIG }}
          
          # 1. Crée le dossier de build à l'avance
          mkdir -p ${{ env.BUILD_DIR }}
          
          # 🔗 CRÉATION DES LIENS SYMBOLIQUES ABSOLUS (Force la redirection vers les vraies sources)
          ln -sfn $(pwd)/drivers/kernelsu ${{ env.BUILD_DIR }}/drivers/kernelsu
          ln -sfn $(pwd)/drivers/kernelsu $(pwd)/KernelSU
          ln -sfn $(pwd)/drivers/kernelsu ${{ env.BUILD_DIR }}/KernelSU
          
          # Génération de la base .config
          make O=${{ env.BUILD_DIR }} LLVM=1 CROSS_COMPILE=$CROSS_COMPILE CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 ${{ env.DEFCONFIG }}
          
          # Forçage des configurations requises dans le .config généré
          {
            echo "CONFIG_RESUKISU=y"
            echo "CONFIG_RESUKISU_SUS_PATH=y"
            echo "CONFIG_KSU_MANUAL_HOOK=y"
            echo "CONFIG_KPROBES=y"
            echo "CONFIG_HAVE_KPROBES=y"
            echo "CONFIG_KRETPROBES=y"
            echo "CONFIG_OVERLAY_FS=y"
            echo "CONFIG_OVERLAY_FS_REDIRECT_DIR=y"
          } >> ${{ env.BUILD_DIR }}/.config
          
          make O=${{ env.BUILD_DIR }} LLVM=1 CROSS_COMPILE=$CROSS_COMPILE CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 olddefconfig
          
          # 2. ⚡ SCRIPT PYTHON ALLÉGÉ ET SÉCURISÉ ⚡
          echo "🚀 Injection chirurgicale des hooks ReSukiSU sur fs/open.c..."
          python3 -c '
          import os

          os.system("git checkout fs/open.c")

          with open("fs/open.c", "r") as f:
              orig_content = f.read()

          # On repasse sur un chemin relatif classique qui remontera proprement grâce au lien symbolique
          headers = "#include \"../drivers/kernelsu/kernel/ksu.h\"\n"
          new_content = headers + orig_content

          target_func = "long do_faccessat(int dfd, const char __user *filename, int mode)"
          idx = new_content.find(target_func)
          if idx != -1:
              brace_idx = new_content.find("{", idx)
              if brace_idx != -1:
                  vars_inj = "\n#ifdef CONFIG_KSU_MANUAL_HOOK\n\tint *flags_null = NULL;\n#endif\n"
                  new_content = new_content[:brace_idx+1] + vars_inj + new_content[brace_idx+1:]
                  
                  idx_hook = new_content.find("if (mode & ~S_IRWXO)", brace_idx)
                  if idx_hook != -1:
                      hook_inj = "#ifdef CONFIG_KSU_MANUAL_HOOK\n\textern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\n\tksu_handle_faccessat(&dfd, &filename, &mode, flags_null);\n#endif\n\n\t"
                      new_content = new_content[:idx_hook] + hook_inj + new_content[idx_hook:]

          with open("fs/open.c", "w") as f:
              f.write(new_content)
          
          # On s"assure que la structure existe dans out/ et on y pose le fichier
          out_open_c = os.path.join("${{ env.BUILD_DIR }}", "fs/open.c")
          os.makedirs(os.path.dirname(out_open_c), exist_ok=True)
          with open(out_open_c, "w") as f:
              f.write(new_content)

          print("✅ fs/open.c synchronisé avec succès.")
          '

          # 3. Nettoyage global des chaînes résiduelles
          find . -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's/\.\.\/kernelSU\/ksu\.h/\.\.\/drivers\/kernelsu\/kernel\/ksu\.h/g' {} + || true
          find . -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's/kernelSU/kernelsu/g' {} + || true

          # 4. 🎯 PATCH DU TACTILE MOTOROLA (PROTÉGÉ À 100%)
          echo "🛠️ Application des contournements matériels et signatures..."
          sed -i 's/if (!check_version(/if (0 \&\& !check_version(/g' kernel/module.c
          
          printf "\n/* --- Début Patch Tactile --- */\n#include <linux/notifier.h>\n#include <linux/module.h>\nstatic BLOCKING_NOTIFIER_HEAD(motorola_panel_notifier_list);\nint panel_register_notifier(struct notifier_block *nb) {\n    return blocking_notifier_chain_register(&motorola_panel_notifier_list, nb);\n}\nEXPORT_SYMBOL(panel_register_notifier);\nint panel_unregister_notifier(struct notifier_block *nb) {\n    return blocking_notifier_chain_unregister(&motorola_panel_notifier_list, nb);\n}\nEXPORT_SYMBOL(panel_unregister_notifier);\nvoid touch_set_state(int state) { return; }\nEXPORT_SYMBOL(touch_set_state);\n/* --- Fin Patch Tactile --- */\n" >> techpack/display/msm/msm_drv.c
          
          # 5. Lancement final de la compilation
          make O=${{ env.BUILD_DIR }} LLVM=1 CROSS_COMPILE=$CROSS_COMPILE CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 KCFLAGS="$KCFLAGS" -j$(nproc) Image

          
      - name: Repack & Finalize (Magiskboot)
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p repack
          cp boot-stock.img repack/boot.img
          
          wget -q https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk -O Magisk-v27.0.apk
          unzip -q Magisk-v27.0.apk lib/x86_64/libmagiskboot.so
          mv lib/x86_64/libmagiskboot.so repack/magiskboot
          chmod +x repack/magiskboot
          rm -rf Magisk-v27.0.apk lib/
          
          cd repack
          ./magiskboot unpack boot.img
          cp ${{ github.workspace }}/${{ env.KERNEL_PATH }}/${{ env.BUILD_DIR }}/arch/arm64/boot/Image kernel
          ./magiskboot repack boot.img new-boot.img
          mv new-boot.img ../final_boot.img
          
          cd ..
          mkdir -p final_output
          mv final_boot.img final_output/boot.img

      - name: Upload Finished Packaged Assets
        uses: actions/upload-artifact@v4
        with:
          name: kernel-motorola_ReSukiSU
          path: final_output/boot.img
